services:
  # ── Backend: FastAPI + LangGraph + ChromaDB + WeasyPrint ──────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: researchgpt-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.1-8b-instant}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.1}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-4096}
      - CHROMA_PATH=/app/chroma_data
      - CHROMA_COLLECTION=researchgpt_documents
      - EXPORT_DIR=/app/exports
    volumes:
      - chroma_data:/app/chroma_data
      - exports_data:/app/exports
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Frontend: React SPA + Nginx Reverse Proxy ─────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: researchgpt-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  chroma_data:
    name: researchgpt_chroma_data
  exports_data:
    name: researchgpt_exports_data
