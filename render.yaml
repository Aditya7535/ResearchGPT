services:
  # ── ResearchGPT Backend (FastAPI + ChromaDB + WeasyPrint) ───────────────────
  - type: web
    name: researchgpt-backend
    runtime: docker
    dockerfilePath: Dockerfile.backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false # Set your Groq API key in Render Dashboard
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: LLM_TEMPERATURE
        value: "0.1"
      - key: LLM_MAX_TOKENS
        value: "4096"
      - key: CHROMA_PATH
        value: /app/chroma_data
      - key: CHROMA_COLLECTION
        value: researchgpt_documents
      - key: EXPORT_DIR
        value: /app/exports

  # ── ResearchGPT Frontend (React + Vite Static Site) ─────────────────────────
  - type: web
    name: researchgpt-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_BASE_URL
        sync: false # Enter your backend URL, e.g. https://researchgpt-backend.onrender.com
